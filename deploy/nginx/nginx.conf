# Propagate one correlation id from the proxy to the app so nginx access logs
# and backend logs can be joined. This file is included from the http{} context,
# so map/log_format are legal here.
map $http_x_request_id $req_id {
    default   $http_x_request_id;  # honour a caller/upstream trace
    ""        $request_id;         # else nginx's built-in 32-hex id
}

# Distinct name: redefining "combined" inside http{} is a startup error.
log_format orinforum_main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rid=$http_x_request_id rt=$request_time';

# ── SSR page cache (anonymous reads) ──────────────────────────────────────────
#
# The frontend renders every page per request (vinext SSR). Load testing pinned
# that at ~10 req/s — the site's first ceiling, an order of magnitude below the
# API. Anonymous public pages are byte-identical for every visitor, so nginx
# keeps them in a small shared cache and the origin renders at most once per TTL
# per URL instead of once per request.
#
# Safety rules, all enforced by the maps below:
#   * only GET on public content paths is cacheable (login/admin/API/crawler are
#     excluded by path);
#   * any request carrying a session cookie bypasses lookup AND storage — the
#     SSR HTML embeds the signed-in shell (avatar, unread badge), so sharing it
#     would leak one user's page to another;
#   * RSC / router-prefetch requests bypass — they return a flight payload on
#     the same URL and must never share an entry with the HTML document.
#
# TTL is deliberately short (60s): a forum timeline may lag a minute, and
# proxy_cache_use_stale + background_update keep serving while a refresh renders.

proxy_cache_path /var/cache/nginx/orinforum levels=1:2 keys_zone=orin_html:64m
                 max_size=1g inactive=10m use_temp_path=off;

map $http_cookie $orin_has_session {
    default              0;
    "~*master_session="  1;
    "~*master_auth="     1;
}

# 1 = path that must never be cached (allow-list is expressed as "not 1").
map $uri $orin_path_uncacheable {
    default          1;
    "~^/$"           0;
    "~^/timeline"    0;
    "~^/spaces"      0;
    "~^/t/"          0;
    "~^/user/"       0;
    "~^/search"      0;
    "~^/leaderboard" 0;
    "~^/motions"     0;
}

# The origin sends "Vary: RSC, Next-Router-*, X-Vinext-*" and nginx refuses to
# cache any response carrying Vary (it cannot express those variants in a key).
# So the cache ignores Vary (below) and instead bypasses every request that
# carries one of those headers: a client that sends them must never be able to
# put an RSC/flight payload into the HTML entry, and an RSC client must never
# be served the HTML document.
map "$http_rsc$http_next_router_prefetch$http_next_router_state_tree$http_next_router_segment_prefetch$http_x_vinext_rsc_render_mode$http_x_vinext_rsc_state_fingerprint$http_x_vinext_interception_id" $orin_is_prefetch {
    default 1;
    ""      0;
}

# The frontend compresses according to Accept-Encoding and nginx keys its cache
# by string only — fold the encoding into the key so a gzip body is never handed
# to a client that did not ask for it.
map $http_accept_encoding $orin_encoding_class {
    default    "identity";
    "~*br"     "br";
    "~*gzip"   "gzip";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    access_log /var/log/nginx/access.log orinforum_main;

    # API / Swagger → Backend
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app adopts this value as its trace id when no traceparent is set.
        proxy_set_header X-Request-ID $req_id;
    }

    # Swagger UI / API docs → Backend
    location /swagger/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Same correlation id as /api/v1/: swagger requests hit the same handlers.
        proxy_set_header X-Request-ID $req_id;
    }

    # Health check
    #
    # This is nginx answering locally, not the app's /api/v1/health probe, so
    # there is no upstream to carry the id. Echo it anyway so a caller can still
    # correlate its own retries with the nginx access log line.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        add_header X-Request-ID $req_id always;
    }

    # Crawler endpoints → Backend.
    #
    # These six paths are owned exclusively by the backend (internal/handler/seo.go).
    # Without these exact-match locations they fall through to `location /` and the
    # frontend answers 404, because it deliberately implements no crawler files.
    # `=` (exact match) keeps them from ever shadowing a future frontend route by
    # prefix — a prefix match here would swallow any nested path silently.
    location = /sitemap.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /sitemap-posts.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /sitemap-spaces.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /sitemap-tags.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /robots.txt {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /latest.rss {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
    }

    # Static / SSR → Frontend
    #
    # X-Request-ID is propagated here too. Without it the frontend (SSR and
    # browser-initiated calls it logs) had no shared id with the backend, so a
    # user reporting "the page broke" could not be joined to a backend trace.
    # The frontend forwards the value on its own /api/v1 calls when it has one.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Anonymous SSR page cache. See the maps above for the bypass rules.
        proxy_cache                  orin_html;
        proxy_cache_key              "$scheme$host$request_uri|$orin_encoding_class";
        proxy_cache_valid            200 60s;
        proxy_cache_valid            301 302 307 60s;
        proxy_cache_valid            404 10s;
        proxy_cache_lock             on;
        proxy_cache_lock_timeout     10s;
        proxy_cache_use_stale        updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass           $orin_has_session $orin_is_prefetch $orin_path_uncacheable;
        proxy_no_cache               $orin_has_session $orin_is_prefetch $orin_path_uncacheable;
        # Upstream marks every page "private, no-store" and varies on RSC/vinext
        # headers; both block caching in nginx. Vary is folded into the bypass
        # map above (never into the key), and the encoding into the key itself.
        # Set-Cookie is deliberately NOT ignored: a response that sets a cookie
        # is never stored, so a session-bearing page cannot become shared.
        proxy_ignore_headers         Cache-Control Expires Vary;
        add_header                   X-Cache-Status $upstream_cache_status always;
    }
}
