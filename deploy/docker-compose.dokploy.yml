# Feed Chamber — Dokploy 档：入口交给 Dokploy 的 Traefik，nginx 不占宿主机端口。
#
#   Compose Path → ./deploy/docker-compose.dokploy.yml
#   Domains      → Service 选 nginx、Container Port 80、开 HTTPS
#
# 与 docker-compose.yml 的三处差异，其余服务保持一致（改基础档时同步这里）：
#   1. nginx 用 expose 而非 ports —— 80/443 归 dokploy-traefik，再 bind 报
#      "Bind for 0.0.0.0:80 failed: port is already allocated"
#   2. nginx 额外接入 dokploy-network —— Traefik 的 docker provider 只发现这个网络
#   3. backend / frontend 用 image: 而不是 build: —— 镜像由 GitHub Actions
#      构建推 GHCR，线上只 pull。服务器上构建会打穿这台机器的内存（见 backend 注释）。
#
# 为什么整份复制：Compose 的 include 会报 "services.nginx conflicts with imported
# resource"，!override 虽能替换 nginx 但会丢掉 image/volumes/depends_on。两者实测均不可行。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedchamber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedchamber}
      POSTGRES_DB: ${POSTGRES_DB:-feedchamber}
      TZ: Asia/Shanghai
    volumes: ["feedchamber_pg:/var/lib/postgresql/data"]
    expose: ["5432"]
    healthcheck:
      # pg_isready 而非 TCP 探测：postgres 初始化阶段也监听端口，但还不能接连接
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedchamber} -d ${POSTGRES_DB:-feedchamber}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    # -js 必须开：KV Store 与 EventBus 都依赖 JetStream；-sd 落卷，容器重建不丢
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes: ["feedchamber_nats:/data"]
    expose: ["4222", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    # 线上**只拉镜像、不构建**：镜像是 GitHub Actions 推的
    # （.github/workflows/docker-build.yml → ghcr.io/<owner>/feedchamber-server）。
    # 这台机器 2 vCPU / 3.9G 且 swap 已满，go build + vinext build 一起跑会
    # 直接把内存打穿（实测 load 131、全站不可用），所以 Dokploy 档必须去掉 build。
    # IMAGE_TAG 默认跟 develop 分支 tag；回滚时在 .env 里改成 sha-<短哈希> 再部署。
    image: ghcr.io/noelorin/feedchamber-server:${IMAGE_TAG:-develop}
    # CI 每次推的是同一个 tag（develop），本地若已有该 tag，compose 默认不会去拉。
    # always 才能让「push → 构建 → 部署」真正换上新镜像；拉取失败时 compose 会
    # 在替换容器前中止，旧容器继续服务。
    pull_policy: always
    environment:
      DB_TYPE: postgres
      DB_DSN: "host=postgres user=${POSTGRES_USER:-feedchamber} password=${POSTGRES_PASSWORD:-feedchamber} dbname=${POSTGRES_DB:-feedchamber} port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      # 必填：内嵌 nats-server 已剥离，为空时后端启动即 Fatal
      NATS_URL: nats://nats:4222
      NATS_BUCKET: feedchamber_kv
      PORT: "8080"
      METRICS_ENABLED: "true"
      METRICS_PORT: "9091"
      TRACING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_OUTPUT: ${LOG_OUTPUT:-stderr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # sitemap / robots / canonical / OG 的域名来源。settings 表的 site_url 优先，
      # 本变量是回退；两者都空则输出 localhost:8080（启动时会 warn）。
      SITE_URL: ${SITE_URL:-}
      # master_session cookie 的 Secure 位，默认 true：容器部署必然在反代之后
      # （Cloudflare / Traefik / nginx），对外就是 HTTPS。
      # 本地 http 直连调试时用 MASTER_COOKIE_SECURE=false 覆盖。
      MASTER_COOKIE_SECURE: ${MASTER_COOKIE_SECURE:-true}
    volumes: ["feedchamber_uploads:/app/server/uploads"]
    expose: ["8080", "9091"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    # 同 backend：镜像来自 CI，服务器不构建。
    image: ghcr.io/noelorin/feedchamber-web:${IMAGE_TAG:-develop}
    pull_policy: always
    environment:
      API_BASE_URL: http://backend:8080
      NODE_ENV: production
      PORT: "3000"
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    expose: ["80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [default, dokploy-network]
    restart: unless-stopped

# 每个卷都写成显式映射（含 name）：Dokploy 保存 compose 时会丢弃值为空的
# 条目（feedchamber_pg: 解析成 null 后被丢掉），导致部署时报
# service "postgres" refers to undefined volume feedchamber_pg。
volumes:
  feedchamber_pg:
    name: feedchamber_pg
  feedchamber_nats:
    name: feedchamber_nats
  feedchamber_uploads:
    name: feedchamber_uploads

networks:
  dokploy-network:
    external: true
