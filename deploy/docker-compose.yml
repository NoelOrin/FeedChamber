# Feed Chamber — 默认部署（一键可运行）
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 依赖两个外部服务，均由本档一并启动：
#   postgres  — 主库（DB_TYPE=postgres），数据落 named volume feedchamber_pg
#   nats      — KV Store / EventBus，必须启用 JetStream（-js）
#
# 后端进程内嵌 nats-server 已于 2026-10-28 剥离：KV 与 EventBus 的生命周期不再
# 绑在应用进程上，多实例可共享会话缓存、限流窗口与权限同步。NATS_URL 为空时
# 后端启动即失败（fail fast），不再静默降级成只有本进程可见的存储。
#
# 指标经容器网络内的 METRICS_PORT(9091) 暴露；deploy/ 下的 prometheus.yml、
# grafana/、blackbox/ 可直接挂到外部 Prometheus / Grafana 使用。
#
# 可选环境变量（全部有默认值）：
#   HTTP_PORT            宿主机端口，默认 80
#   ADMIN_PASSWORD  初始 admin 密码；留空则随机生成并打印到容器日志：
#                        docker compose -f deploy/docker-compose.yml logs backend | grep -i admin
#   LOG_LEVEL / LOG_FORMAT / LOG_OUTPUT

name: feedchamber

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedchamber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedchamber}
      POSTGRES_DB: ${POSTGRES_DB:-feedchamber}
      # 时区与 backend 的 DB_DSN 保持一致，避免 created_at 落库差 8 小时。
      TZ: Asia/Shanghai
    volumes:
      - feedchamber_pg:/var/lib/postgresql/data
    # 不映射到宿主机：只有 compose 网络内的 backend 需要连它。
    # 本地要用 psql/GUI 调试时临时加 "127.0.0.1:5432:5432"。
    expose: ["5432"]
    healthcheck:
      # pg_isready 比 TCP 探测可靠：postgres 在初始化阶段也会监听端口，
      # 但此时还不能接受连接，backend 会在建表时失败。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feedchamber} -d ${POSTGRES_DB:-feedchamber}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    # -js 必须开：KV Store（JetStream KV bucket）与 EventBus 都依赖它。
    # -sd /data 把 JetStream 存储放到 named volume，容器重建不丢队列与 KV。
    # -m 8222 是监控端口，只在容器网络内（下面 expose），不对外。
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - feedchamber_nats:/data
    expose: ["4222", "8222"]
    healthcheck:
      # NATS 的 healthz 端点由 -m 监控端口提供，未开 -m 时会失败。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # NATS 自身指标（/varz、JetStream 存储水位）经这个 exporter 转成 Prometheus 格式。
  # NATS 原生只暴露 JSON 的 /varz，Prometheus 无法直接抓；用官方镜像的 exporter
  # 桥接。-js / -sd 的采集包含 JetStream 存储与消费者滞后。
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    # -varz 服务器级、-jsz all JetStream 账户/流级；-connz 连接数。
    command: ["-varz", "-jsz", "all", "-connz", "http://nats:8222"]
    expose: ["7777"]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      # context 取仓库根：Dockerfile 的 COPY 路径与根 .dockerignore 都按仓库根书写，
      # 前后端两个镜像因此共用同一份上下文与同一套忽略规则。
      context: ..
      dockerfile: app/server/Dockerfile
      # 依赖源默认官方；网络慢时用环境变量覆盖，例如
      #   GOPROXY=https://goproxy.cn,direct docker compose build backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: feedchamber/server:local
    environment:
      DB_TYPE: postgres
      # host 用服务名；密码与库名与下方 postgres 服务保持一致。
      # sslmode=disable 是因为 postgres 与 backend 在同一个 compose 网络内。
      DB_DSN: "host=postgres user=${POSTGRES_USER:-feedchamber} password=${POSTGRES_PASSWORD:-feedchamber} dbname=${POSTGRES_DB:-feedchamber} port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      # 外部 NATS（必须启用 JetStream，见下方 nats 服务）。
      NATS_URL: nats://nats:4222
      NATS_BUCKET: feedchamber_kv
      PORT: "8080"
      # 指标端口只在容器网络内可达，刻意不映射到宿主机（端点无鉴权）。
      METRICS_ENABLED: "true"
      METRICS_PORT: "9091"
      TRACING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_OUTPUT: ${LOG_OUTPUT:-stderr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # sitemap / robots / canonical / OG 的域名来源。settings 表的 site_url 优先，
      # 本变量是回退；两者都空则输出 localhost:8080（启动时会 warn）。
      SITE_URL: ${SITE_URL:-}
      # master_session cookie 的 Secure 位，默认 true：容器部署必然在反代之后
      # （Cloudflare / Traefik / nginx），对外就是 HTTPS。
      # 本地 http 直连调试时用 MASTER_COOKIE_SECURE=false 覆盖。
      MASTER_COOKIE_SECURE: ${MASTER_COOKIE_SECURE:-true}
    volumes:
      # 上传仍落本地卷（S3 是可选替代，见 STORAGE_TYPE）。
      - feedchamber_uploads:/app/server/uploads
    expose: ["8080", "9091"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # /api/v1/health 在依赖异常时返回非 2xx，wget 随之非零退出。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      # 必须是仓库根：app/web/Dockerfile 要 COPY 根部的 pnpm-lock.yaml /
      # pnpm-workspace.yaml 与 packages/，拿 app/web 当 context 会直接 COPY 失败。
      context: ..
      dockerfile: app/web/Dockerfile
      # 依赖源默认官方；网络慢时用环境变量覆盖，例如
      #   NPM_REGISTRY=https://registry.npmmirror.com docker compose build frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: feedchamber/web:local
    environment:
      # SSR 侧请求后端的 origin；浏览器侧仍走同源 /api/v1，由 nginx 转发。
      API_BASE_URL: http://backend:8080
      NODE_ENV: production
      PORT: "3000"
    expose: ["3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # 用 ports 不用 expose：标准档前面没有反代，改成 expose 宿主机不监听、站点打不开。
    # 将来加了反代再改绑 "127.0.0.1:${HTTP_PORT:-80}:80"。
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # postgres 数据目录（原 SQLite 的 feedchamber_db 已不再使用）。
  feedchamber_pg:
  # NATS JetStream 存储：KV bucket + 事件队列。
  feedchamber_nats:
  feedchamber_uploads:
