pre-commit:
  parallel: true
  commands:
    # biome 自动修复 + 自动暂存：格式与可安全修复的 lint 问题在提交前就修掉，
    # 且把结果重新 add 回 index，所以进入提交的就是修复后的内容。
    #
    # 为什么放在这里而不是 pre-push：pre-commit 阶段提交还没生成，修复是
    # 「让这次提交变正确」，不涉及改写历史、不需要自己发起推送，也不会出现
    # 「终端报 push 失败但远端其实成功了」那种误导性输出。
    # 历史做法（pre-push 里 amend + 自推送）已删除，见 git 历史 e9096a1..b45d11b。
    #
    # --write 只做安全修复（格式化、import 排序、useTemplate 等）；改不动的
    # 规则问题仍会以非零退出码拦下提交，不会被静默放过。
    "lint-staged":
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,css,json}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    # 模块代码有改动但对应 AGENTS.md 没更新时提示一句。只提示不阻断
    # （|| true）：本地不该因为文档被卡住，真正的门在 CI 的 docs job。
    "agents-docs-hint":
      run: node scripts/check-agents-docs.mjs --staged || true

commit-msg:
  commands:
    "commit-msg lint":
      run: npx commitlint --edit {1}

# 分支名校验：放行 main/develop，其余必须 <type>/<scope?>/<short-desc>，
# type 取自 commitlint 的 type-enum。纯 POSIX，跨平台安全。
pre-push:
  commands:
    "branch-name":
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        case "$branch" in
          main|develop) exit 0 ;;
        esac
        if printf '%s' "$branch" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert|types|wip)(/[a-z0-9._-]+)+$'; then
          exit 0
        fi
        echo "branch '$branch' does not match <type>/<scope?>/<short-desc>"
        echo "allowed types: feat fix docs style refactor perf test chore build ci revert types wip"
        echo "allowed branches: main develop"
        exit 1
