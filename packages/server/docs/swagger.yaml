basePath: /api/v1
definitions:
  model.Announcement:
    properties:
      author_id:
        type: string
      content:
        description: markdown 格式
        type: string
      created_at:
        type: string
      display_type:
        description: 1=toast 2=alert 3=modal
        type: integer
      expires_at:
        type: string
      id:
        type: string
      is_pinned:
        type: boolean
      position:
        type: string
      sort:
        type: integer
      status:
        description: draft / published
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  model.Banned:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_permanent:
        type: boolean
      reason:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  model.Category:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Content:
    properties:
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      like_count:
        type: integer
      parent_id:
        type: string
      root_id:
        type: string
      updated_at:
        type: string
    type: object
  model.Notification:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_read:
        type: boolean
      reference_id:
        type: string
      sender_id:
        type: string
      type:
        type: string
      user_id:
        type: string
    type: object
  model.Permission:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.Post:
    properties:
      author_id:
        type: string
      category_id:
        type: string
      comment_count:
        type: integer
      content_digest:
        type: string
      content_id:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      favorite_count:
        type: integer
      id:
        type: string
      like_count:
        type: integer
      locked:
        type: boolean
      pinned:
        type: boolean
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  model.PostListItem:
    properties:
      author_avatar:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      category_id:
        type: string
      category_name:
        type: string
      comment_count:
        type: integer
      content_digest:
        type: string
      created_at:
        type: string
      favorite_count:
        type: integer
      id:
        type: string
      like_count:
        type: integer
      locked:
        type: boolean
      pinned:
        type: boolean
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  model.Report:
    properties:
      created_at:
        type: string
      id:
        type: string
      reason:
        type: string
      reporter_id:
        type: string
      status:
        type: string
      target_id:
        type: string
      target_type:
        type: string
      updated_at:
        type: string
    type: object
  model.Role:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Tag:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Upload:
    properties:
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      key:
        description: 对象存储 key
        type: string
      mime_type:
        type: string
      path:
        description: 本地路径（local 模式）
        type: string
      size:
        type: integer
      stored_name:
        type: string
      uploader_id:
        type: string
      url:
        description: 公开访问 URL
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
  pkg.ErrCode:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 2001
    - 3001
    - 3002
    - 5001
    type: integer
    x-enum-varnames:
    - SUCCESS
    - TOKEN_NOT_EXIST
    - TOKEN_WRONG
    - TOKEN_EXPIRED
    - INVALID_PASSWORD
    - USER_NOT_FOUND
    - USERNAME_EXISTS
    - FORBIDDEN
    - TOKEN_REVOKED
    - USER_BANNED
    - EMAIL_EXISTS
    - INVALID_PARAMS
    - NOT_FOUND
    - ALREADY_EXISTS
    - INTERNAL_ERROR
  pkg.Response:
    properties:
      code:
        $ref: '#/definitions/pkg.ErrCode'
      data: {}
      msg:
        type: string
    type: object
  service.AdminStats:
    properties:
      todayNewComments:
        type: integer
      todayNewPosts:
        type: integer
      todayNewUsers:
        type: integer
      totalCategories:
        type: integer
      totalComments:
        type: integer
      totalPosts:
        type: integer
      totalUsers:
        type: integer
    type: object
  service.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  service.LoginRequest:
    properties:
      login:
        description: email or username
        type: string
      password:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: OrinForum 社区论坛 API 文档
  title: OrinForum API
  version: "1.0"
paths:
  /admin/settings:
    get:
      consumes:
      - application/json
      description: 获取全部系统设置键值对
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取所有系统设置
      tags:
      - 系统设置
  /admin/settings/{key}:
    delete:
      consumes:
      - application/json
      description: 删除指定 key 的系统设置
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 删除系统设置
      tags:
      - 系统设置
    get:
      consumes:
      - application/json
      description: 根据 key 获取系统设置值
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取单个系统设置
      tags:
      - 系统设置
    put:
      consumes:
      - application/json
      description: 创建或更新指定 key 的系统设置
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      - description: 设置值
        in: body
        name: body
        required: true
        schema:
          properties:
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 设置系统设置
      tags:
      - 系统设置
  /admin/settings/batch:
    post:
      consumes:
      - application/json
      description: 批量创建或更新系统设置
      parameters:
      - description: 设置键值对
        in: body
        name: body
        required: true
        schema:
          properties:
            settings:
              type: object
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 批量设置系统设置
      tags:
      - 系统设置
  /admin/stats:
    get:
      consumes:
      - application/json
      description: 获取用户、帖子、评论、分类的总数及今日新增数量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AdminStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取论坛统计数据
      tags:
      - 管理后台
  /announcements/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取公告详情
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Announcement'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取公告详情
      tags:
      - 公告
  /announcements/{id}/delete:
    post:
      consumes:
      - application/json
      description: 删除指定公告
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 删除公告
      tags:
      - 公告
  /announcements/{id}/publish:
    post:
      consumes:
      - application/json
      description: 将指定公告状态改为已发布
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 发布公告
      tags:
      - 公告
  /announcements/{id}/unpublish:
    post:
      consumes:
      - application/json
      description: 将指定公告状态改为草稿
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 撤回公告
      tags:
      - 公告
  /announcements/{id}/update:
    post:
      consumes:
      - application/json
      description: 更新指定公告的内容
      parameters:
      - description: 公告 ID
        in: path
        name: id
        required: true
        type: string
      - description: 公告信息
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
            display_type:
              type: integer
            expires_at:
              type: string
            is_pinned:
              type: boolean
            position:
              type: string
            sort:
              type: integer
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Announcement'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 更新公告
      tags:
      - 公告
  /announcements/create:
    post:
      consumes:
      - application/json
      description: 创建一条新公告
      parameters:
      - description: 公告信息
        in: body
        name: body
        required: true
        schema:
          properties:
            content:
              type: string
            display_type:
              type: integer
            expires_at:
              type: string
            is_pinned:
              type: boolean
            position:
              type: string
            sort:
              type: integer
            status:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/model.Announcement'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 创建公告
      tags:
      - 公告
  /announcements/list:
    get:
      consumes:
      - application/json
      description: 分页获取所有公告（含草稿）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.Announcement'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 公告列表
      tags:
      - 公告
  /announcements/published:
    get:
      consumes:
      - application/json
      description: 分页获取已发布且未过期的公告
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.Announcement'
                      type: array
                  type: object
              type: object
      summary: 已发布公告列表
      tags:
      - 公告
  /auth/change_password:
    post:
      consumes:
      - application/json
      description: 使用旧密码修改当前用户的密码
      parameters:
      - description: 密码信息
        in: body
        name: body
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/first_change_password:
    post:
      consumes:
      - application/json
      description: 管理员首次登录后修改密码，可选修改用户名
      parameters:
      - description: 新密码信息
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 首次修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名或邮箱登录，返回 access_token、refresh_token 和用户信息
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 登出当前用户（使当前 token 失效）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用当前 JWT 中的用户信息刷新 access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 刷新 access token
      tags:
      - 认证
  /auth/refresh_token:
    post:
      consumes:
      - application/json
      description: 使用 refresh_token 换取新的 access_token
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
