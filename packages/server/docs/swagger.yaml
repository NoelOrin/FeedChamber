basePath: /api/v1
definitions:
  model.Category:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Content:
    properties:
      authorID:
        type: string
      body:
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      id:
        type: string
      likeCount:
        type: integer
      parentID:
        description: direct parent content; empty for post body
        type: string
      rootID:
        description: points to post's content_id; self-referencing for post body
        type: string
      updatedAt:
        type: string
    type: object
  model.Notification:
    properties:
      content:
        description: display text
        type: string
      createdAt:
        type: string
      id:
        type: string
      isRead:
        type: boolean
      referenceID:
        description: post_id, comment_id, or user_id depending on type
        type: string
      senderID:
        description: who triggered the notification
        type: string
      type:
        description: '"reply", "like", "follow", "mention"'
        type: string
      userID:
        description: recipient
        type: string
    type: object
  model.Permission:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  model.Post:
    properties:
      authorID:
        type: string
      categoryID:
        type: string
      commentCount:
        description: denormalized reply count
        type: integer
      contentDigest:
        description: denormalized preview for list queries
        type: string
      contentID:
        description: FK → contents.id (post body)
        type: string
      createdAt:
        type: string
      deletedAt:
        type: string
      favoriteCount:
        type: integer
      id:
        type: string
      likeCount:
        description: denormalized like count
        type: integer
      locked:
        type: boolean
      pinned:
        type: boolean
      status:
        description: draft/pending/approved/rejected
        type: string
      title:
        type: string
      updatedAt:
        type: string
      viewCount:
        type: integer
    type: object
  model.PostListItem:
    properties:
      authorAvatar:
        type: string
      authorId:
        type: string
      authorName:
        type: string
      categoryId:
        type: string
      categoryName:
        type: string
      commentCount:
        type: integer
      contentDigest:
        type: string
      createdAt:
        type: string
      favoriteCount:
        type: integer
      id:
        type: string
      likeCount:
        type: integer
      locked:
        type: boolean
      pinned:
        type: boolean
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      viewCount:
        type: integer
    type: object
  model.Report:
    properties:
      createdAt:
        type: string
      id:
        type: string
      reason:
        type: string
      reporterID:
        type: string
      status:
        description: '"pending", "resolved", "dismissed"'
        type: string
      targetID:
        type: string
      targetType:
        description: '"post" or "comment"'
        type: string
      updatedAt:
        type: string
    type: object
  model.Role:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Tag:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.Upload:
    properties:
      createdAt:
        type: string
      fileName:
        description: original filename
        type: string
      id:
        type: string
      mimeType:
        description: e.g. "image/png"
        type: string
      path:
        description: relative path
        type: string
      size:
        description: bytes
        type: integer
      storedName:
        description: uuid-based name on disk
        type: string
      uploaderID:
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      role:
        type: string
      updatedAt:
        type: string
      username:
        type: string
      uuid:
        type: string
    type: object
  pkg.ErrCode:
    enum:
    - 0
    - 1001
    - 1002
    - 1003
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 2001
    - 3001
    - 3002
    - 5001
    type: integer
    x-enum-varnames:
    - SUCCESS
    - TOKEN_NOT_EXIST
    - TOKEN_WRONG
    - TOKEN_EXPIRED
    - INVALID_PASSWORD
    - USER_NOT_FOUND
    - USERNAME_EXISTS
    - FORBIDDEN
    - TOKEN_REVOKED
    - USER_BANNED
    - EMAIL_EXISTS
    - INVALID_PARAMS
    - NOT_FOUND
    - ALREADY_EXISTS
    - INTERNAL_ERROR
  pkg.Response:
    properties:
      code:
        $ref: '#/definitions/pkg.ErrCode'
      data: {}
      msg:
        type: string
    type: object
  service.AdminStats:
    properties:
      todayNewComments:
        type: integer
      todayNewPosts:
        type: integer
      todayNewUsers:
        type: integer
      totalCategories:
        type: integer
      totalComments:
        type: integer
      totalPosts:
        type: integer
      totalUsers:
        type: integer
    type: object
  service.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  service.LoginRequest:
    properties:
      login:
        description: email or username
        type: string
      password:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: OrinForum 社区论坛 API 文档
  title: OrinForum API
  version: "1.0"
paths:
  /admin/settings:
    get:
      consumes:
      - application/json
      description: 获取全部系统设置键值对
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取所有系统设置
      tags:
      - 系统设置
  /admin/settings/{key}:
    delete:
      consumes:
      - application/json
      description: 删除指定 key 的系统设置
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 删除系统设置
      tags:
      - 系统设置
    get:
      consumes:
      - application/json
      description: 根据 key 获取系统设置值
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  type: string
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取单个系统设置
      tags:
      - 系统设置
    put:
      consumes:
      - application/json
      description: 创建或更新指定 key 的系统设置
      parameters:
      - description: 设置键名
        in: path
        name: key
        required: true
        type: string
      - description: 设置值
        in: body
        name: body
        required: true
        schema:
          properties:
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 设置系统设置
      tags:
      - 系统设置
  /admin/stats:
    get:
      consumes:
      - application/json
      description: 获取用户、帖子、评论、分类的总数及今日新增数量
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AdminStats'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取论坛统计数据
      tags:
      - 管理后台
  /auth/change_password:
    post:
      consumes:
      - application/json
      description: 使用旧密码修改当前用户的密码
      parameters:
      - description: 密码信息
        in: body
        name: body
        required: true
        schema:
          properties:
            new_password:
              type: string
            old_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/first_change_password:
    post:
      consumes:
      - application/json
      description: 管理员首次登录后修改密码，可选修改用户名
      parameters:
      - description: 新密码信息
        in: body
        name: body
        required: true
        schema:
          properties:
            name:
              type: string
            new_password:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 首次修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名或邮箱登录，返回 access_token、refresh_token 和用户信息
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 登出当前用户（使当前 token 失效）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用当前 JWT 中的用户信息刷新 access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 刷新 access token
      tags:
      - 认证
  /auth/refresh_token:
    post:
      consumes:
      - application/json
      description: 使用 refresh_token 换取新的 access_token
      parameters:
      - description: refresh token
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    access_token:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 刷新令牌
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 注册新用户，返回 access_token、refresh_token 和用户信息
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 用户注册
      tags:
      - 认证
  /auth/reset_password:
    post:
      consumes:
      - application/json
      description: 管理员重置指定用户的密码
      parameters:
      - description: 重置信息
        in: body
        name: body
        required: true
        schema:
          properties:
            new_password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      summary: 重置密码
      tags:
      - 认证
  /categories/:
    get:
      consumes:
      - application/json
      description: 获取所有分类列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 分类列表
      tags:
      - 分类
    post:
      consumes:
      - application/json
      description: 创建新分类
      parameters:
      - description: 分类信息
        in: body
        name: body
        required: true
        schema:
          properties:
            description:
              type: string
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Category'
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建分类
      tags:
      - 分类
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定分类
      parameters:
      - description: 分类 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: Forbidden
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - 分类
  /contents/{contentId}/like:
    get:
      consumes:
      - application/json
      description: 获取当前用户对内容的点赞状态和总点赞数
      parameters:
      - description: 内容 ID
        in: path
        name: contentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    liked:
                      type: boolean
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取内容点赞状态
      tags:
      - 点赞
    post:
      consumes:
      - application/json
      description: 切换内容的点赞状态（帖子正文或评论）
      parameters:
      - description: 内容 ID
        in: path
        name: contentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    liked:
                      type: boolean
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 内容点赞/取消点赞
      tags:
      - 点赞
  /contents/{id}/replies:
    get:
      consumes:
      - application/json
      description: 获取指定内容的直接子回复
      parameters:
      - description: 内容 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Content'
            type: array
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 子回复列表
      tags:
      - 内容
  /favorites/:
    get:
      consumes:
      - application/json
      description: 分页获取当前用户的收藏帖子 ID 列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 用户收藏列表
      tags:
      - 收藏
  /health:
    get:
      consumes:
      - application/json
      description: 检查服务是否正常运行
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              status:
                type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
  /notifications:
    get:
      consumes:
      - application/json
      description: 分页获取当前用户的通知列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/pkg.Response'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/model.Notification'
                      type: array
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 获取通知列表
      tags:
      - 通知
  /notifications/{id}/read:
    put:
      consumes:
      - application/json
      description: 标记指定通知为已读
      parameters:
      - description: 通知 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pkg.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pkg.Response'
      security:
      - BearerAuth: []
      summary: 标记通知已读
      tags:
