name: Feature request
description: 提出一个功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先确认三件事：路由（`internal/router/routes_*.go`）、端点索引、后台菜单里是否已有。
        路线图与「明确不做」见
        [文档站 / 路线图](https://noelorin.github.io/FeedChamber/roadmap/)。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是先给方案。
      placeholder: 作为……我在……时遇到……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
      description: 如果涉及 API，请给出方法、路径与请求体形状。
      placeholder: |
        POST /api/v1/xxx/list
        body: { page, pageSize, ... }

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过的？为什么不够？

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 后端 API
        - 前台界面
        - 管理后台
        - 认证与权限
        - 审核与治理
        - 成长体系
        - MCP / 集成
        - 部署与运维
        - 文档
