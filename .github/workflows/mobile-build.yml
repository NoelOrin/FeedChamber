# Feed Chamber Mobile Build
# 通过 GitHub Actions 构建 Android APK/AAB 和 iOS IPA
#
# 触发条件：手动触发 workflow_dispatch（可选平台 + 构建类型）
#
# 必需 Secrets（Android）：
#   ANDROID_KEYSTORE_BASE64     # base64 -i release.keystore
#   ANDROID_KEYSTORE_PASSWORD   # 密钥库密码
#   ANDROID_KEY_ALIAS           # 密钥别名
#   ANDROID_KEY_PASSWORD        # 密钥密码
#
# 必需 Secrets（iOS，仅 macOS runner 生效）：
#   IOS_CERTIFICATE_P12_BASE64         # base64 -i dist.p12
#   IOS_CERTIFICATE_PASSWORD           # p12 密码
#   IOS_PROVISIONING_PROFILE_BASE64    # base64 -i profile.mobileprovision
#   IOS_TEAM_ID                        # Apple Developer Team ID
#
# 可选 Secrets：
#   IOS_APP_STORE_CONNECT_API_KEY      # App Store Connect API Key JSON（用于上传 TestFlight）
#   IOS_APP_STORE_CONNECT_API_KEY_ID   # API Key ID
#   IOS_APP_STORE_CONNECT_ISSUER_ID    # Issuer ID
#   CAPACITOR_APP_ID                   # 覆盖 capacitor.config.ts 默认值
#   CAPACITOR_APP_NAME                 # 覆盖显示名称

name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  CAPACITOR_APP_ID: ${{ secrets.CAPACITOR_APP_ID || 'com.feedchamber.app' }}
  CAPACITOR_APP_NAME: ${{ secrets.CAPACITOR_APP_NAME || 'Feed Chamber' }}
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ===================================================================
  #  Android Build（ubuntu-latest，免费）
  # ===================================================================
  android:
    name: Android (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    if: inputs.platform == 'all' || inputs.platform == 'android'
    strategy:
      matrix:
        build_type:
          - ${{ inputs.build_type }}
    env:
      MOBILE_SERVER_URL: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Capacitor + init Android project
        working-directory: app/web
        run: |
          pnpm add -D @capacitor/core @capacitor/cli @capacitor/android dotenv
          pnpm dlx cap add android

      - name: Build Web (production)
        working-directory: app/web
        run: pnpm exec vite build

      - name: Sync Web assets to Android
        working-directory: app/web
        run: pnpm dlx cap sync android

      - name: Decode keystore from secret
        if: matrix.build_type == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Configure Gradle signing (release)
        if: matrix.build_type == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> gradle.properties <<EOF
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g
          ORIN_KEYSTORE_FILE=release.keystore
          ORIN_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          ORIN_KEY_ALIAS=$ANDROID_KEY_ALIAS
          ORIN_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK (${{ matrix.build_type }})
        working-directory: android
        run: |
          if [ "${{ matrix.build_type }}" = "release" ] && [ -f app/release.keystore ]; then
            ./gradlew assembleRelease
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            cp "$APK" ../app-feedchamber-release.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../app-feedchamber-debug.apk
          fi

      - name: Build AAB (release only)
        if: matrix.build_type == 'release' && secrets.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          ./gradlew bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../app-feedchamber.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.build_type }}
          path: |
            app-feedchamber*.apk
            app-feedchamber*.aab
          retention-days: 30

  # ===================================================================
  #  iOS Build（macos-latest，GitHub 付费 runner）
  # ===================================================================
  ios:
    name: iOS (${{ matrix.build_type }})
    runs-on: macos-14
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    strategy:
      matrix:
        build_type:
          - ${{ inputs.build_type }}
    env:
      MOBILE_SERVER_URL: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Node.js + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Import signing certificate
        if: secrets.IOS_CERTIFICATE_P12_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Import provisioning profile
        if: secrets.IOS_PROVISIONING_PROFILE_BASE64 != ''
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Install Capacitor + init iOS project
        working-directory: app/web
        run: |
          pnpm add -D @capacitor/core @capacitor/cli @capacitor/ios dotenv
          pnpm dlx cap add ios

      - name: Generate app icons
        working-directory: app/web
        run: pnpm dlx @capacitor/assets generate --icon --ios --icon-source public/pwa-512x512.png || true

      - name: Build Web (production)
        working-directory: app/web
        run: pnpm exec vite build

      - name: Sync Web assets to iOS
        working-directory: app/web
        run: pnpm dlx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build iOS (${{ matrix.build_type }})
        run: |
          if [ "${{ matrix.build_type }}" = "release" ]; then
            EXPORT_METHOD="app-store"
            CONFIGURATION="Release"
          else
            EXPORT_METHOD="development"
            CONFIGURATION="Debug"
          fi

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$EXPORT_METHOD</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>stripSwiftOptionals</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration $CONFIGURATION \
            -archivePath build/Feed Chamber.xcarchive \
            -allowProvisioningUpdates \
            | tee build.log | xcpretty

          xcodebuild -exportArchive \
            -archivePath build/Feed Chamber.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            | tee export.log | xcpretty

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.build_type }}
          path: build/export/*.ipa
          retention-days: 30
